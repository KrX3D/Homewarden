<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <title>Homewarden</title>
    <script>
      // Apply the saved theme before first paint so there is no light flash.
      try { var t = localStorage.getItem('hw.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; document.documentElement.dataset.palette = localStorage.getItem('hw.palette') || 'violet'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
